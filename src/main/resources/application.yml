server:
  port: 8081

spring:
  application:
    name: thortful-app

  datasource:
    url: jdbc:h2:mem:testdb  # in memory DB
    driver-class-name: org.h2.Driver
    username: sa             # default user for H2
    password:                # no password
  h2:
    console:
      enabled: true          # Activate  H2 cli
      path: /h2-console      # cli url
  jpa:
    hibernate:
      ddl-auto: update       # create/update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always